<title>Monita: Hood</title>
<desc>Hand-written flat macOS icon on the standard 824px tile of a 1024px canvas. A pale butter-yellow tile is the screen; the black island hangs from its top edge like the notch dock and peeks down. Its two eyes, Codex blue and Claude orange, sit at the centre of the tile. No gradients, shadows, lighting effects, texture, bevels, or raster images.</desc>
