name: macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned dependencies
        run: npm ci --prefix monitor-probe/runtime --ignore-scripts --no-audit --no-fund
      - name: Native app checks and build
        run: sh task-island/release.sh
      - name: Codex protocol regressions
        run: node monitor-probe/test.mjs
      - name: First-install and update packaging
        run: python3 -m unittest discover -s tests
